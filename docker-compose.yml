services:
  jav-bot:
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "8765:8765"
    volumes:
      - ./torrents.json:/app/torrents.json
      - ./rss_items.json:/app/rss_items.json
      - ./pushed_codes.json:/app/pushed_codes.json
      - ./rss.xml:/app/rss.xml
      - ./bot.log:/app/bot.log
